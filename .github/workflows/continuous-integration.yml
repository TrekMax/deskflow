name: Continuous Integration

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Test release automation
        run: python3 .github/scripts/test-release.py
      - uses: fsfe/reuse-action@v5
      - uses: ./.github/actions/lint-clang

  main-build:
    name: ${{ matrix.target.name }}
    needs: lint
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: ubuntu-24.04-x86_64
            runner: ubuntu-24.04
            like: ubuntu-24.04
            qt-version: '6.8.3'
            qt-host: linux
            qt-arch: linux_gcc_64
            config: '-DCMAKE_INSTALL_PREFIX=/usr -DBUNDLE_LINUX_RUNTIME=ON'
          - name: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
            like: ubuntu-24.04
            qt-version: '6.8.3'
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
            config: '-DCMAKE_INSTALL_PREFIX=/usr -DBUNDLE_LINUX_RUNTIME=ON'
          - name: windows-x64
            runner: windows-2022
            qt-version: '6.12.0'
            qt-host: windows
            qt-arch: win64_msvc2022_64
            msvc-arch: amd64
            vcpkg-triplet: x64-windows-release
          - name: windows-arm64
            runner: windows-11-arm
            qt-version: '6.12.0'
            qt-host: windows_arm64
            qt-arch: win64_msvc2022_arm64
            msvc-arch: arm64
            vcpkg-triplet: arm64-windows
          - name: macos-x86_64
            runner: macos-15-intel
            qt-version: '6.9.3'
            qt-host: mac
            qt-arch: clang_64
            config: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0'
          - name: macos-arm64
            runner: macos-15
            qt-version: '6.12.0'
            qt-host: mac
            qt-arch: clang_64
            config: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.target.msvc-arch }}
          spectre: true
      - name: Install dependencies
        id: deps
        uses: ./.github/actions/install-dependencies
        with:
          like: ${{ matrix.target.like }}
          qt-version: ${{ matrix.target.qt-version }}
          qt-host: ${{ matrix.target.qt-host }}
          qt-arch: ${{ matrix.target.qt-arch }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}
      - uses: ./.github/actions/get-version
      - name: Configure
        env:
          EXTRA_CONFIG: ${{ matrix.target.config }}
          VCPKG_CONFIG: ${{ steps.deps.outputs.vcpkg-cmake-config }}
        run: |
          read -r -a config_args <<< "$EXTRA_CONFIG"
          read -r -a vcpkg_args <<< "$VCPKG_CONFIG"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_BUILD_TESTS=ON -DBUILD_TESTS=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DPACKAGE_VERSION_LABEL="$DESKFLOW_PACKAGE_VERSION" \
            "${config_args[@]}" "${vcpkg_args[@]}"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Tests
        uses: ./.github/actions/run-tests
        with:
          job: ${{ matrix.target.name }}
      - name: Package
        run: cmake --build build --target package --parallel 4
      - name: Validate package
        uses: ./.github/actions/test-package
        with:
          like: ${{ matrix.target.like }}
      - name: Check tracked files
        run: git diff --exit-code
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target.name }}
          path: |
            build/deskflow-*.deb
            build/deskflow-*.msi
            build/deskflow-*-portable.zip
            build/deskflow-*.dmg
          if-no-files-found: error
          retention-days: 14

  ci-passed:
    runs-on: ubuntu-24.04
    needs: [lint, main-build]
    if: always()
    steps:
      - name: Require all six targets
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.main-build.result }}
        run: test "$LINT_RESULT" = success && test "$BUILD_RESULT" = success

  release:
    needs: ci-passed
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/get-version
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
      - name: Validate release assets and checksums
        run: python3 .github/scripts/prepare-release.py dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-release.sh dist
