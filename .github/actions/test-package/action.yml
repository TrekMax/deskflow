name: "Test Package"
description: "Installs the built package and verifies the installed binaries can run"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    - name: Test Windows ZIP and MSI
      if: runner.os == 'Windows'
      run: ./.github/scripts/test-windows-package.ps1
      shell: pwsh

    - name: Test package
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          dmg=$(ls build/deskflow-*.dmg | head -1)
          echo "Y" | hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/deskflow-dmg
          trap 'hdiutil detach /tmp/deskflow-dmg' EXIT
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH
          codesign --verify --deep --strict /tmp/deskflow-dmg/Deskflow.app
          /tmp/deskflow-dmg/Deskflow.app/Contents/MacOS/deskflow-core --version
          QT_QPA_PLATFORM=offscreen /tmp/deskflow-dmg/Deskflow.app/Contents/MacOS/Deskflow --version
          if find /tmp/deskflow-dmg/Deskflow.app -type f -perm +111 -exec otool -L {} \; 2>/dev/null | grep -E '^\s+(/opt/homebrew|/usr/local/opt|/Users/runner)'; then
            echo 'Package still depends on build-machine libraries' >&2
            exit 1
          fi

        elif [ "$RUNNER_OS" == "Linux" ]; then
          if [ "${{inputs.like}}" == "ubuntu-24.04" ]; then
            bash .github/scripts/test-linux-package.sh build
            exit 0
          elif [ "${{inputs.like}}" == "debian" ]; then
            apt-get install -y ./build/deskflow-*.deb
          elif [ "${{inputs.like}}" == "fedora" ]; then
            dnf install -y build/deskflow-*.rpm
          elif [ "${{inputs.like}}" == "suse" ]; then
            zypper install -y --allow-unsigned-rpm build/deskflow-*.rpm
          elif [ "${{inputs.like}}" == "arch" ]; then
            pacman -U --noconfirm build/deskflow-*.pkg.tar.zst
          else
            echo "Unknown like: ${{inputs.like}}"
            exit 1
          fi
          QT_QPA_PLATFORM=minimal deskflow-core --version

        else
          echo "Unknown OS: $RUNNER_OS"
          exit 1
        fi
