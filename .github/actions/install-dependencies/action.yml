name: "Install dependencies for deskflow"
description: "Install the dependencies needed to build deskflow"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false

  qt-version:
    description: "Exact version of the Qt SDK"
    required: false

  qt-host:
    description: "Qt download host"
    required: false

  qt-arch:
    description: "Qt SDK architecture"
    required: false

  vcpkg-triplet:
    description: "vcpkg triplet to use (Windows)"
    required: false

outputs:
  vcpkg-cmake-config:
    description: "windows vcpkg output for cmaket"
    value: ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}

runs:
  using: "composite"

  steps:
    - name: Install Depends
      if: ${{ runner.os != 'Windows' }}
      run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install openssl --quiet
          elif [ "$RUNNER_OS" == "Linux" ]; then
            if [ "${{inputs.like}}" == "ubuntu-24.04" ]; then
              sudo apt-get update -qq
              sudo apt-get install -y build-essential cmake ninja-build pkg-config \
                python3-jinja2 python3-attr meson patchelf dpkg-dev curl \
                xorg-dev libssl-dev libxkbfile-dev libxkbregistry-dev libxkbcommon-dev \
                libxkbcommon-x11-dev libglib2.0-dev libxcb-cursor-dev \
                libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libfontconfig1-dev \
                libfreetype-dev libdbus-1-dev libice-dev libsm-dev
            elif [ "${{inputs.like}}" == "debian" ]; then
              apt update -qqq > /dev/null
              apt install -qqq cmake build-essential ninja-build \
                xorg-dev libx11-dev libxtst-dev libssl-dev libxkbfile-dev \
                qt6-base-dev qt6-tools-dev libxkbregistry-dev libxkbcommon-dev \
                libei-dev libportal-dev help2man -y >/dev/null
            elif [ ${{inputs.like}} == "fedora" ]; then
              dnf config-manager setopt fedora-cisco-openh264.enabled=0
              dnf install -y cmake make ninja-build gcc-c++ rpm-build openssl-devel \
                libXtst-devel libxkbfile-devel qt6-qtbase-devel qt6-qttools-devel libxkbcommon-x11-devel \
                libei-devel libxkbcommon-devel libportal-devel help2man libXinerama-devel libXrandr-devel
            elif [ ${{inputs.like}} == "suse" ]; then
              zypper refresh
              zypper install -y --force-resolution \
                cmake make ninja gcc-c++ rpm-build libopenssl-devel \
                libXtst-devel libxkbfile-devel qt6-base-devel qt6-tools-devel \
                qt6-linguist-devel libxkbcommon-devel libxkbcommon-x11-devel libxkbregistry-devel \
                libei-devel libportal-devel help2man libXinerama-devel libXrandr-devel
            elif [ ${{ inputs.like }} == "arch" ]; then
              pacman -Syu --noconfirm base-devel cmake ninja \
                gcc openssl libxtst libxkbfile libei libportal libxkbcommon-x11 \
                qt6-base qt6-tools qt6-svg qt6-translations qt6-declarative help2man doxygen graphviz rsync libxkbcommon libxinerama libxrandr
            else
              echo "Unknown like"
            fi
          else
            echo "Unknown OS: $RUNNER_OS"
          fi
      shell: bash

    - name: Install Qt
      if: runner.os != 'Linux' || inputs.like == 'ubuntu-24.04'
      uses: jurplel/install-qt-action@v4
      env:
        AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
      with:
        version: ${{inputs.qt-version}}
        host: ${{inputs.qt-host}}
        arch: ${{inputs.qt-arch}}
        modules: qtsvg
        install-deps: false
        cache: true
        cache-key-prefix: qt-${{runner.os}}-${{runner.arch}}-${{inputs.qt-version}}-${{inputs.qt-arch}}
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e

    - name: Build and cache vcpkg
      if: ${{ runner.os == 'Windows' }}
      id: vcpkg
      uses: johnwason/vcpkg-action@v8
      with:
        pkgs: openssl
        extra-args: --classic --host-triplet=${{inputs.vcpkg-triplet}}
        triplet: ${{inputs.vcpkg-triplet}}
        token: ${{ github.token }}
        revision: d5ec528843d29e3a52d745a64b469f810b2cedbf

    - name: Cache Ubuntu dependencies
      if: inputs.like == 'ubuntu-24.04'
      id: ubuntu-cache
      uses: actions/cache@v4
      with:
        path: deps/prefix
        key: noble-deps-${{runner.arch}}-${{hashFiles('.github/scripts/build-linux-deps.sh')}}

    - name: Build Ubuntu dependencies
      if: inputs.like == 'ubuntu-24.04' && steps.ubuntu-cache.outputs.cache-hit != 'true'
      run: bash .github/scripts/build-linux-deps.sh
      shell: bash

    - name: Configure Ubuntu dependency paths
      if: inputs.like == 'ubuntu-24.04'
      run: |
        echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/deps/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
        echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/deps/prefix:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
      shell: bash

    - name: Install Wix
      if: ${{ runner.os == 'Windows' }}
      run: |
        dotnet tool install --global wix --version 5.0.2
        wix extension add --global WixToolset.UI.wixext/5.0.2
        wix extension add --global WixToolset.Util.wixext/5.0.2
        wix extension add --global WixToolset.Firewall.wixext/5.0.2
      shell: pwsh

